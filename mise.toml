# Pinned CI/hook tools (base-repo-standard). `mise install` fetches these exact releases and checks each
# download against mise.lock; Renovate bumps the versions. Run a check with `mise run check:<name>`.
[tools]
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:koalaman/shellcheck" = "0.11.0"

[tasks."check:secrets"]
description = "Secrets anywhere in the history (gitleaks; .gitleaks.toml adds rules when present)"
run = "gitleaks git --redact --no-banner --log-level warn --exit-code 1 ."

[tasks."check:workflows"]
description = "GitHub workflows: syntax + shellcheck on run steps (actionlint), security (zizmor)"
run = ["actionlint -pyflakes= -color", "zizmor --no-progress ."]

[tasks."check:shell"]
description = "Tracked shell scripts (*.sh, .githooks/*) with the pinned shellcheck"
run = 'files=$(git ls-files "*.sh" ".githooks/*"); [ -z "$files" ] || shellcheck $files'

[tasks."check:vulns"]
description = "Known vulnerabilities in lockfiles (osv-scanner; osv-scanner.toml holds dated ignores)"
run = 'osv-scanner scan source --recursive . || { s=$?; [ "$s" -eq 128 ] && echo "osv-scanner: nothing to scan" || exit "$s"; }'

[tasks.check]
description = "Every base check"
depends = ["check:secrets", "check:workflows", "check:shell", "check:vulns"]
